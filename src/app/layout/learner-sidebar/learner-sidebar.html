<div class="sidebar-content">
  <a class="landing-brand" routerLink="/" aria-label="TheSDEStudio home">
    <span class="landing-brand-mark"><mat-icon>terminal</mat-icon></span>
    <span>TheSDE<span>Studio</span></span>
  </a>

  <div class="navigation-groups">
    @for (group of navigationGroups; track group.title) {
      <section class="navigation-group">
        <p class="group-title">{{ group.title }}</p>

        <mat-nav-list>
          @for (item of group.items; track item.route) {
            <a
              mat-list-item
              [routerLink]="item.route"
              routerLinkActive="nav-active"
              [routerLinkActiveOptions]="{ exact: true }"
              (click)="navigate.emit()"
            >
              <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        </mat-nav-list>
      </section>
    }
  </div>
</div>
